services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./data:/app/data:ro
      - ./evals:/app/evals

    working_dir: /app

    command:
      - python
      - -m
      - evals.run_eval